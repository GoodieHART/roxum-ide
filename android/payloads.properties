# Payload modules that can be fused into the base APK for sideload / offline builds.
#
# The runtime and extension payloads live in dynamic-feature modules, which a plain
# `flutter build apk` does not package (only `bundleRelease` sees them). Selecting a
# payload copies its assets/*.zip and jniLibs/arm64-v8a/*.so into the base module so a
# single self-contained APK ships it, with no AAB + bundletool round-trip.
#
#   flutter build apk --release                      -> ORG_GRADLE_PROJECT_payloads=all
#   ./gradlew :app:assembleRelease -Ppayloads=python,node
#
# Unset => nothing is staged, so the Play / AAB path stays lean.
#
# key   = runtime or extension key, matching lib/ui/downloads.dart
#         (_pfdRuntimes / _pfdExtensions)
# value = dynamic-feature directory under android/app/src/
#
# An archive is expected at <feature>/src/main/assets/<key>.zip when present;
# `ty` is jniLibs-only (libty.so) and therefore has no archive.

python=python_feature
clang=clang_feature
node=node_feature
ty=ty_feature
bash-language-server=bash_language_server_feature
copilot-language-server=copilot_language_server_feature
vscode-langservers-extracted=vscode_langservers_extracted_feature
